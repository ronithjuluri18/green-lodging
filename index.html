<style>
/* ===========================================================================
   Green Lodging LLC — visual system
   Brand: deep pine green. Attention states carry colour (amber / red);
   everything that is fine stays quiet. That way colour always means "look".
   =========================================================================== */

:root{
  --ground:#F3F6F4; --surface:#FFFFFF; --surface-2:#F8FAF9;
  --ink:#131A18; --ink-2:#48534F; --ink-3:#77837E;
  --line:#DBE3DF; --line-2:#EAEFEC;
  --brand:#1B5A45; --brand-2:#12412F; --brand-soft:#E2EDE8; --on-brand:#FFFFFF;
  --warn:#96660F; --warn-soft:#F9EEDA;
  --crit:#A8383A; --crit-soft:#F9E7E7;
  --calm:#3B6A8C; --calm-soft:#E6EEF5;
  --shadow:0 1px 2px rgba(19,26,24,.06), 0 6px 16px rgba(19,26,24,.05);
  --r:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C110F; --surface:#141B19; --surface-2:#19221F;
    --ink:#E6EDEA; --ink-2:#A4B1AC; --ink-3:#76837E;
    --line:#26322E; --line-2:#1D2724;
    --brand:#6FBFA1; --brand-2:#8FD3B9; --brand-soft:#16302662; --on-brand:#0C110F;
    --warn:#D9A855; --warn-soft:#2C2414;
    --crit:#E28A8B; --crit-soft:#2F1A1B;
    --calm:#8DB6D6; --calm-soft:#17252F;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 16px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --ground:#0C110F; --surface:#141B19; --surface-2:#19221F;
  --ink:#E6EDEA; --ink-2:#A4B1AC; --ink-3:#76837E;
  --line:#26322E; --line-2:#1D2724;
  --brand:#6FBFA1; --brand-2:#8FD3B9; --brand-soft:#163026; --on-brand:#0C110F;
  --warn:#D9A855; --warn-soft:#2C2414;
  --crit:#E28A8B; --crit-soft:#2F1A1B;
  --calm:#8DB6D6; --calm-soft:#17252F;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 16px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.ff{font-family:"Libre Franklin",system-ui,sans-serif}
h1,h2,h3{margin:0; text-wrap:balance; letter-spacing:-.01em}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--brand)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.hide{display:none !important}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px}

/* ---------- boot ---------- */
.bootscreen{min-height:70vh; display:grid; place-content:center; text-align:center; gap:6px}
.bootmark{font-family:"Libre Franklin"; font-weight:800; font-size:19px; letter-spacing:-.02em; color:var(--brand)}
.bootnote{font-size:13px; color:var(--ink-3)}

/* ===================== SIGN-IN ===================== */
.authpage{min-height:100vh; display:grid; grid-template-columns:1fr; align-content:start}
.authbar{background:var(--brand); color:var(--on-brand); padding:26px 22px}
.authbar .co{font-family:"Libre Franklin"; font-weight:800; font-size:21px; letter-spacing:-.02em; display:flex; align-items:center; gap:10px}
.authbar .co svg{flex:none}
.authbar .tag{font-size:13px; opacity:.85; margin-top:4px}
.authwrap{width:100%; max-width:440px; margin:0 auto; padding:26px 18px 70px}
.authcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
.authcard .pad{padding:20px}
.authtabs{display:flex; border-bottom:1px solid var(--line)}
.authtab{flex:1; border:0; background:var(--surface-2); padding:13px 8px; cursor:pointer;
  font-family:"Libre Franklin"; font-weight:600; font-size:14px; color:var(--ink-3); border-bottom:2px solid transparent}
.authtab[aria-selected="true"]{background:var(--surface); color:var(--brand); border-bottom-color:var(--brand)}
.authnote{font-size:13px; color:var(--ink-2); margin:0 0 16px; line-height:1.5}
.authswitch{text-align:center; margin-top:16px; font-size:13.5px; color:var(--ink-2)}
.authalt{margin-top:18px; padding-top:16px; border-top:1px solid var(--line-2);
  text-align:center; font-size:13.5px; color:var(--ink-2)}

/* --- one card, two doors --- */
.authpage.solo{min-height:100vh; display:grid; place-items:center; background:var(--ground)}
.authpage.solo .authwrap{padding-block:34px}
.authtop{padding:26px 24px 4px; text-align:center}
.authmark{width:44px; height:44px; border-radius:12px; background:var(--brand); color:var(--on-brand);
  display:grid; place-items:center; margin:0 auto 14px}
.authco{font-family:"Libre Franklin",sans-serif; font-weight:800; font-size:20px;
  letter-spacing:-.025em; margin:0}
.authsub{font-size:13px; color:var(--ink-3); margin-top:5px}
.audtabs{display:flex; gap:3px; background:var(--surface-2); border:1px solid var(--line);
  border-radius:10px; padding:3px; margin:20px 24px 0}
.audtabs button{flex:1; border:0; background:none; font:inherit; font-family:"Libre Franklin",sans-serif;
  font-weight:600; font-size:13.5px; color:var(--ink-2); padding:9px 8px; border-radius:8px;
  cursor:pointer; white-space:nowrap}
.audtabs button:hover{color:var(--ink)}
.audtabs button[aria-selected="true"]{background:var(--surface); color:var(--brand); font-weight:700;
  box-shadow:0 1px 3px rgba(19,26,24,.12)}
.authfoot{text-align:center; font-size:12px; color:var(--ink-3); margin:14px auto 0; max-width:340px}
.linkbtn{background:none; border:0; padding:2px; color:var(--brand); font:inherit; font-weight:600;
  cursor:pointer; text-decoration:underline; text-underline-offset:3px; border-radius:4px}
.linkbtn:hover{color:var(--brand-2)}
.rowend{display:flex; justify-content:flex-end; margin-top:-4px}

/* password box with a reveal button */
.pwwrap{position:relative; display:block}
.pwwrap input{padding-right:48px}
.pweye{position:absolute; right:5px; top:50%; transform:translateY(-50%); border:0; background:none;
  padding:8px; cursor:pointer; color:var(--ink-3); border-radius:7px; line-height:0;
  display:grid; place-items:center}
.pweye:hover{color:var(--ink); background:var(--line-2)}
.pweye[aria-pressed="true"]{color:var(--brand)}
.capslock{font-size:12px; color:var(--warn); margin-top:5px; font-weight:600;
  font-family:"Libre Franklin",sans-serif}
.meter{height:5px; border-radius:99px; background:var(--line-2); overflow:hidden}
.meter i{display:block; height:100%; width:0; border-radius:99px;
  transition:width .18s ease, background .18s ease}
.errbox b{display:block; margin-bottom:3px}
.errbox .btn.sm.pri{background:var(--crit); border-color:var(--crit); color:#fff}

/* ===================== SHELL ===================== */
.app{display:flex; min-height:100vh; align-items:stretch}
.rail{width:236px; flex:0 0 236px; background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh}
.brand{padding:18px 16px 14px; border-bottom:1px solid var(--line-2)}
.brand .mark{font-family:"Libre Franklin"; font-weight:800; font-size:15px; letter-spacing:-.02em;
  display:flex; align-items:center; gap:8px; color:var(--brand)}
.brand .sub{font-size:11px; color:var(--ink-3); margin-top:3px; letter-spacing:.05em;
  text-transform:uppercase; font-family:"Libre Franklin"; font-weight:600}
.navlist{padding:9px; display:flex; flex-direction:column; gap:1px; overflow-y:auto; flex:1}
.navbtn{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:9px 11px;
  border:0; background:transparent; border-radius:7px; cursor:pointer;
  font-family:"Libre Franklin"; font-weight:600; font-size:13.5px; color:var(--ink-2)}
.navbtn:hover{background:var(--surface-2); color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--brand-soft); color:var(--brand)}
.navbtn .cnt{margin-left:auto; font-size:11px; font-family:"IBM Plex Mono"; background:var(--crit);
  color:#fff; border-radius:20px; padding:1px 7px; font-weight:500}
.railfoot{padding:11px 14px; border-top:1px solid var(--line-2); font-size:11.5px; color:var(--ink-3)}
.railfoot .who{color:var(--ink-2); font-weight:600; font-family:"Libre Franklin"; font-size:12.5px;
  display:block; margin-bottom:2px; overflow-wrap:anywhere}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:16px 24px 13px;
  border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:20}
.topbar h1{font-size:20px; font-weight:700}
.topbar .crumb{font-size:11px; color:var(--ink-3); font-family:"Libre Franklin"; font-weight:700;
  text-transform:uppercase; letter-spacing:.07em; display:block; margin-bottom:2px}
.topbar .spacer{flex:1}
.wrap{padding:20px 24px 70px; max-width:1200px; width:100%}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:8px 13px;
  border-radius:7px; cursor:pointer; font-family:"Libre Franklin"; font-weight:600; font-size:13.5px;
  display:inline-flex; align-items:center; justify-content:center; gap:7px; white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.55; cursor:default}
.btn.pri{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-2); border-color:var(--brand-2)}
.btn.sm{padding:5px 10px; font-size:12.5px}
.btn.big{padding:12px 16px; font-size:15px; width:100%}
.btn.danger{color:var(--crit); border-color:var(--crit-soft)}

/* ---------- panels ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.panel-h{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line-2); flex-wrap:wrap}
.panel-h h2{font-size:14.5px; font-weight:700}
.panel-h .spacer{flex:1}
.eyebrow{font-family:"Libre Franklin"; font-weight:700; font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3)}
.stack{display:flex; flex-direction:column; gap:16px}

/* ---------- KPI ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:12px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px}
.kpi .v{font-family:"Libre Franklin"; font-weight:800; font-size:24px; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; line-height:1.15}
.kpi .l{font-size:11px; color:var(--ink-3); font-family:"Libre Franklin"; font-weight:600;
  text-transform:uppercase; letter-spacing:.05em; margin-top:3px}
.kpi .n{font-size:12px; color:var(--ink-2); margin-top:6px}
.kpi.crit .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)} .kpi.brand .v{color:var(--brand)}

/* ---------- alerts ---------- */
.alerts{display:flex; flex-direction:column}
.alert{display:flex; gap:12px; align-items:flex-start; padding:12px 16px 12px 13px;
  border-top:1px solid var(--line-2); border-left:3px solid transparent}
.alert:first-child{border-top:0}
.alert.crit{border-left-color:var(--crit)}
.alert.warn{border-left-color:var(--warn)}
.alert.info{border-left-color:var(--calm)}
.alert .body{flex:1; min-width:0}
.alert .t{font-family:"Libre Franklin"; font-weight:600; font-size:14px}
.alert .d{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.alert .when{font-size:11.5px; font-family:"IBM Plex Mono"; color:var(--ink-3); white-space:nowrap; padding-top:3px}
.empty{padding:34px 20px; text-align:center; color:var(--ink-3); font-size:13.5px}
.empty strong{display:block; color:var(--ink-2); font-family:"Libre Franklin"; font-size:15px; margin-bottom:5px}

/* ---------- pills ---------- */
.pill{display:inline-flex; align-items:center; gap:5px; font-family:"Libre Franklin"; font-weight:600;
  font-size:11px; letter-spacing:.03em; padding:2px 8px; border-radius:20px; text-transform:uppercase; white-space:nowrap}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.crit{background:var(--crit-soft); color:var(--crit)}
.pill.info{background:var(--calm-soft); color:var(--calm)}
.pill.brand{background:var(--brand-soft); color:var(--brand)}
.pill.mute{background:var(--line-2); color:var(--ink-3)}
.pill.settled{background:transparent; color:var(--ink-3); border:1px solid var(--line)}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.t{width:100%; border-collapse:collapse; font-size:13.5px}
table.t th{text-align:left; font-family:"Libre Franklin"; font-weight:700; font-size:10.5px;
  letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); padding:9px 14px;
  border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface-2)}
table.t td{padding:10px 14px; border-bottom:1px solid var(--line-2); vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
.sub{font-size:12px; color:var(--ink-3)}
/* grouped money columns: government beside tenant */
table.t th.grp{text-align:center; border-bottom:1px solid var(--line);
  background:var(--brand-soft); color:var(--brand)}
table.t th.sml{font-size:9.5px; letter-spacing:.06em; padding-top:6px; padding-bottom:7px}
table.t td.gl{color:var(--ink-3)}
table.t .owe{color:var(--crit); font-weight:600}
table.t td.grouprow{background:var(--surface-2); padding-top:11px; padding-bottom:8px}
table.t tr.subtotal td{border-top:1px solid var(--line); font-weight:700;
  font-family:"Libre Franklin",sans-serif; font-size:12.5px; background:var(--surface-2)}

/* ---------- forms / modal ---------- */
.fld{display:flex; flex-direction:column; gap:5px}
.fld > label{font-family:"Libre Franklin"; font-weight:600; font-size:12px; letter-spacing:.03em;
  text-transform:uppercase; color:var(--ink-2)}
.fld .help{font-size:12px; color:var(--ink-3)}
.fld input,.fld select,.fld textarea{width:100%; padding:10px 11px; border:1px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-size:16px}
.fld textarea{min-height:80px; resize:vertical; font-family:inherit}
.fld input[type=file]{padding:8px; font-size:13px; background:transparent}
.fld.check{flex-direction:row; align-items:center; gap:9px}
.fld.check input{width:auto}
.fld.check label{text-transform:none; letter-spacing:0; font-size:14px; color:var(--ink)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.formstack{display:flex; flex-direction:column; gap:14px}
.note{background:var(--brand-soft); color:var(--brand-2); border-radius:7px; padding:10px 12px; font-size:12.5px; line-height:1.45}
.errbox{background:var(--crit-soft); color:var(--crit); border-radius:7px; padding:10px 12px; font-size:13px; line-height:1.45}
.okbox{background:var(--brand-soft); color:var(--brand-2); border-radius:7px; padding:10px 12px; font-size:13px}

.scrim{position:fixed; inset:0; background:rgba(10,16,14,.55); display:flex; align-items:flex-start;
  justify-content:center; padding:20px 14px; overflow-y:auto; z-index:80; backdrop-filter:blur(2px)}
.modal{background:var(--surface); border-radius:11px; width:100%; max-width:560px;
  box-shadow:0 20px 50px rgba(0,0,0,.32); border:1px solid var(--line); margin:auto 0}
.modal .mh{display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line-2)}
.modal .mh h3{font-size:16px; font-weight:700; flex:1}
.modal .mb{padding:18px 20px; display:flex; flex-direction:column; gap:14px}
.modal .mf{padding:14px 20px; border-top:1px solid var(--line-2); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}

.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink);
  color:var(--ground); padding:11px 18px; border-radius:8px; font-size:13.5px;
  font-family:"Libre Franklin"; font-weight:600; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.28);
  max-width:min(92vw,420px); text-align:center}
.toast.bad{background:var(--crit); color:#fff}

.tabs{display:flex; gap:3px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto}
.tab{border:0; background:none; padding:9px 13px; cursor:pointer; font-family:"Libre Franklin";
  font-weight:600; font-size:13.5px; color:var(--ink-3); border-bottom:2px solid transparent; white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand); border-bottom-color:var(--brand)}

.filters{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.filters select,.filters input{padding:8px 10px; border:1px solid var(--line); border-radius:7px;
  background:var(--surface); font-size:14px}

.doclink{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--brand);
  text-decoration:none; background:none; border:0; padding:0; cursor:pointer; font-family:inherit}
.doclink:hover{text-decoration:underline}

.chk{display:flex; gap:11px; align-items:flex-start; padding:11px 16px; border-top:1px solid var(--line-2)}
.chk:first-child{border-top:0}
.chk .mk{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line); flex:none;
  margin-top:1px; display:grid; place-items:center; font-size:11px; color:var(--on-brand); font-weight:700}
.chk.done .mk{background:var(--brand); border-color:var(--brand)}
.chk.done .tx b{color:var(--ink-3); text-decoration:line-through}
.chk .tx{flex:1; font-size:13.5px}
.chk .tx b{font-family:"Libre Franklin"; display:block; font-size:13.5px}
.chk .tx span{font-size:12.5px; color:var(--ink-3)}

.loading{padding:56px 20px; text-align:center; color:var(--ink-3); font-family:"Libre Franklin"; font-weight:600}

/* ===================== TENANT PORTAL ===================== */
.tp{max-width:720px; margin:0 auto; padding:0 16px 80px}
.tphero{background:var(--brand); color:var(--on-brand); padding:22px 22px 24px; border-radius:0 0 16px 16px; margin-bottom:18px}
.tphero .co{font-family:"Libre Franklin"; font-weight:700; font-size:12px; letter-spacing:.09em;
  text-transform:uppercase; opacity:.8}
.tphero h1{font-size:24px; font-weight:800; margin-top:4px}
.tphero .addr{font-size:13.5px; opacity:.88; margin-top:3px}
.tpbal{margin-top:16px; background:rgba(255,255,255,.13); border-radius:10px; padding:13px 15px;
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.tpbal .amt{font-family:"Libre Franklin"; font-weight:800; font-size:27px; font-variant-numeric:tabular-nums}
.tpbal .lbl{font-size:12.5px; opacity:.88}
.tpnav{display:flex; gap:6px; overflow-x:auto; padding:0 16px 14px; max-width:720px; margin:0 auto;
  -webkit-overflow-scrolling:touch; scrollbar-width:none}
.tpnav::-webkit-scrollbar{display:none}
.tpnav button{border:1px solid var(--line); background:var(--surface); padding:8px 14px; border-radius:20px;
  font-family:"Libre Franklin"; font-weight:600; font-size:13.5px; color:var(--ink-2); cursor:pointer; white-space:nowrap}
.tpnav button[aria-current="true"]{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
.tprow{display:flex; gap:12px; align-items:center; padding:13px 16px; border-top:1px solid var(--line-2)}
.tprow:first-child{border-top:0}
.tprow .g{flex:1; min-width:0}

<body>

<div id="root">
  <div class="bootscreen"><div class="bootmark">Green Lodging LLC</div><div class="bootnote">Opening&hellip;</div></div>
</div>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
/* ===========================================================================
   GREEN LODGING LLC — property management portal
   Runs entirely in the browser. All data lives in Supabase, and what each
   person can see is enforced by the database, not by this file.
   =========================================================================== */
(function () {
"use strict";

/* ------------------------------------------------------------------ utils */
const $  = (s, r) => (r || document).querySelector(s);
const el = (t, a, k) => {
  const n = document.createElement(t);
  if (a) for (const p in a) {
    if (a[p] == null) continue;
    if (p === 'html') n.innerHTML = a[p];
    else if (p === 'text') n.textContent = a[p];
    else if (p.slice(0,2) === 'on') n.addEventListener(p.slice(2), a[p]);
    else n.setAttribute(p, a[p]);
  }
  if (k) (Array.isArray(k) ? k : [k]).forEach(c => c && n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
  return n;
};
const uid4 = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }));

const TODAY = new Date();
const isoOf = d => { const z = new Date(d); return new Date(z.getTime() - z.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const TODAY_ISO  = isoOf(TODAY);
const CUR_PERIOD = TODAY_ISO.slice(0,7);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL= ['January','February','March','April','May','June','July','August','September','October','November','December'];

const days = (a,b) => { if(!a) return 0; return Math.round((new Date(a+'T00:00:00') - new Date((b||TODAY_ISO)+'T00:00:00'))/864e5); };
const fmtDate  = s => { if(!s) return '—'; const p=String(s).slice(0,10).split('-'); return MON[+p[1]-1]+' '+(+p[2])+', '+p[0]; };
const fmtShort = s => { if(!s) return '—'; const p=String(s).slice(0,10).split('-'); return MON[+p[1]-1]+' '+(+p[2]); };
const fmtPeriod= p => { if(!p) return '—'; const x=p.split('-'); return MONL[+x[1]-1]+' '+x[0]; };
const money  = n => (n==null||n==='') ? '—' : '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => '$'+Math.round(Number(n)||0).toLocaleString('en-US');
const addMonths = (p,k) => { let [y,m]=p.split('-').map(Number); m+=k; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return y+'-'+String(m).padStart(2,'0'); };
const periodDue = (p,d) => p+'-'+String(Math.min(Math.max(+d||1,1),28)).padStart(2,'0');
const ord = d => { d=Number(d)||1; return d+(d%10===1&&d!==11?'st':d%10===2&&d!==12?'nd':d%10===3&&d!==13?'rd':'th'); };
const cleanName = s => String(s||'file').replace(/[^A-Za-z0-9._-]+/g,'_').slice(-80);

function toast(msg, bad) {
  const t = el('div', {class:'toast'+(bad?' bad':''), text:msg});
  document.body.appendChild(t);
  setTimeout(() => t.remove(), bad ? 5200 : 3200);
}

/* NYC rent-stabilized: the renewal offer must be served 90–150 days before
   the lease ends (DHCR form RTP-8). These two numbers drive the reminders. */
const RENEW_OPEN = 150, RENEW_CLOSE = 90;

/* Settings come from the block at the top of this file. If they are still
   blank, anything saved through the on-screen setup form takes over, so the
   site can be set up in a browser without ever opening a text editor. */
const BAKED = window.GL_CONFIG || {};
const isPlaceholder = v => !v || String(v).indexOf('PASTE') === 0;
function savedConfig() {
  try { return JSON.parse(localStorage.getItem('gl_setup') || '{}'); } catch (e) { return {}; }
}
const CFG = (function () {
  const s = savedConfig(), out = Object.assign({}, BAKED);
  if (isPlaceholder(out.SUPABASE_URL) && s.SUPABASE_URL) out.SUPABASE_URL = s.SUPABASE_URL;
  if (isPlaceholder(out.SUPABASE_ANON_KEY) && s.SUPABASE_ANON_KEY) out.SUPABASE_ANON_KEY = s.SUPABASE_ANON_KEY;
  ['COMPANY_NAME','EMERGENCY_PHONE','OFFICE_EMAIL'].forEach(k => { if (s[k]) out[k] = s[k]; });
  return out;
})();
const CO  = CFG.COMPANY_NAME || 'Green Lodging LLC';

/* ------------------------------------------------------------ app state */
const S = {
  route:'today', session:null, me:null, sb:null, tab:{}, filter:{},
  period:CUR_PERIOD, loading:true,
  buildings:[], units:[], tenancies:[], leases:[], rent:[],
  utilAccounts:[], utilBills:[], complaints:[], cupdates:[],
  documents:[], profiles:[], invites:[], expenses:[], charges:[]
};
const isStaff  = () => S.me && (S.me.role === 'owner' || S.me.role === 'manager');
const isOwner  = () => S.me && S.me.role === 'owner';

const byId    = (c,id) => S[c].find(x => x.id === id);
const bName   = id => { const b = byId('buildings', id); return b ? b.name : '—'; };
const uLabel  = id => { const u = byId('units', id); return u ? u.label : '—'; };
const uFull   = id => { const u = byId('units', id); return u ? (u.label + ' · ' + bName(u.building_id)) : '—'; };
const unitsOf = bid => S.units.filter(u => u.building_id === bid).sort(cmpUnit);
const cmpUnit = (a,b) => String(a.label||'').localeCompare(String(b.label||''), undefined, {numeric:true});
/* The lease in force TODAY. A store lease with six agreed yearly steps has six
   rows; picking the newest would quote the 2031 rent, so the range that
   actually contains today wins, then the next one due to start, then the last
   one that ended. */
const activeLease = unitId => {
  const ls = S.leases.filter(l => l.unit_id === unitId);
  const covering = ls.filter(l => (!l.start_date || l.start_date <= TODAY_ISO)
                               && (!l.end_date   || l.end_date   >= TODAY_ISO))
                     .sort((a,b)=>String(b.start_date).localeCompare(String(a.start_date)))[0];
  if (covering) return covering;
  const upcoming = ls.filter(l => l.start_date && l.start_date > TODAY_ISO)
                     .sort((a,b)=>String(a.start_date).localeCompare(String(b.start_date)))[0];
  if (upcoming) return upcoming;
  return ls.sort((a,b)=>String(b.end_date).localeCompare(String(a.end_date)))[0];
};
const leaseFor  = (unitId, period) => S.leases.filter(l => l.unit_id===unitId
  && (!l.start_date || l.start_date.slice(0,7) <= period)
  && (!l.end_date   || l.end_date.slice(0,7)   >= period))
  .sort((a,b)=>String(b.start_date).localeCompare(String(a.start_date)))[0];
const rentFor = (unitId, period) => S.rent.find(r => r.unit_id===unitId && r.period===period);

/* ---------------------------------------------------------------------------
   SUBSIDISED RENT
   Most of these apartments are paid twice each month: the agency sends its
   share straight to the landlord, the tenant sends the rest. They are chased
   separately, so they are counted separately.
   SCRIE and DRIE are the exception — they freeze the rent and pay through a
   property tax credit, so no money ever arrives and nothing must look overdue.
   --------------------------------------------------------------------------- */
const SUBSIDY_PROGRAMS = [
  {v:'Section 8',  l:'Section 8 (Housing Choice Voucher)'},
  {v:'CityFHEPS',  l:'CityFHEPS'},
  {v:'FHEPS',      l:'FHEPS'},
  {v:'HASA',       l:'HASA'},
  {v:'SOTA',       l:'SOTA'},
  {v:'HRA',        l:'HRA — other'},
  {v:'SCRIE',      l:'SCRIE (rent freeze — no payment)'},
  {v:'DRIE',       l:'DRIE (rent freeze — no payment)'},
  {v:'Other',      l:'Other programme'}
];
/* Programmes that actually send money. A frozen rent is not a debt. */
const NO_CASH = ['SCRIE','DRIE'];
const paysCash = p => !!p && NO_CASH.indexOf(p) < 0;

/* What is owed this month, and by whom. One place, so the table, the alerts,
   the tenant portal and the export can never disagree. */
function split(unitId, period) {
  const u = byId('units', unitId) || {};
  const l = leaseFor(unitId, period);          // a lease always wins
  const r = rentFor(unitId, period);           // a recorded month wins over today's rent
  const hasCurrent = Number(u.current_rent || 0) > 0;

  /* Show a month only where something is actually known about it: a lease
     covering it, a payment recorded for it, or — for this month only — a
     current rent on the unit. Never invent a history that was not supplied. */
  if (!l && !r && !(period === CUR_PERIOD && hasCurrent)) return null;

  const total = l ? Number(l.monthly_rent || 0)
              : (r && r.amount_due != null) ? Number(r.amount_due)
              : Number(u.current_rent || 0);
  const program = l ? (l.subsidy_program || null)
                : (r && r.govt_program) ? r.govt_program
                : (u.subsidy_program || null);
  const declaredGovt = (r && r.govt_due != null) ? Number(r.govt_due)
                     : l ? Number(l.subsidy_amount || 0)
                     : Number(u.subsidy_amount || 0);
  /* A frozen rent (SCRIE / DRIE) never sends money. Otherwise whatever has
     been entered as the agency share stands, programme named or not. */
  const govtDue   = (program && NO_CASH.indexOf(program) >= 0) ? 0 : declaredGovt;
  const tenantDue = (r && r.tenant_due != null) ? Number(r.tenant_due)
                  : (!l && u.tenant_pays != null && u.tenant_pays !== '')
                      ? Number(u.tenant_pays)
                  : Math.max(total - govtDue, 0);
  const govtPaid  = r ? Number(r.govt_paid || 0) : 0;
  /* Records made before the split existed carry everything in amount_paid. */
  const tenantPaid = r
    ? (r.tenant_paid != null ? Number(r.tenant_paid) : Math.max(Number(r.amount_paid||0) - govtPaid, 0))
    : 0;

  return {
    lease:l, row:r, unit:u, program:program, subsidised: govtDue > 0,
    tenantName: l ? l.tenant_name : (u.current_tenant_name || null),
    caseNo:     l ? l.subsidy_case_no : null,
    leaseId:    l ? l.id : null,
    leaseMissing: !l,
    dueDay: (l && l.rent_due_day) || u.rent_due_day || 1,
    total:total, govtDue:govtDue, tenantDue:tenantDue,
    govtPaid:govtPaid, tenantPaid:tenantPaid, totalPaid: govtPaid + tenantPaid,
    tenantShort: Math.max(tenantDue - tenantPaid, 0),
    govtShort:   Math.max(govtDue   - govtPaid,   0),
    dueDate: periodDue(period, (l && l.rent_due_day) || u.rent_due_day || 1)
  };
}

/* What a unit is charged today, whether that came from a lease or not. */
function currentRent(unitId) {
  const l = activeLease(unitId);
  if (l && l.start_date <= TODAY_ISO && l.end_date >= TODAY_ISO) return Number(l.monthly_rent||0);
  const u = byId('units', unitId) || {};
  return Number(u.current_rent || 0);
}
function currentTenant(unitId) {
  const l = activeLease(unitId);
  if (l && l.start_date <= TODAY_ISO && l.end_date >= TODAY_ISO && l.tenant_name) return l.tenant_name;
  const u = byId('units', unitId) || {};
  return u.current_tenant_name || null;
}
const myUnitIds = () => S.tenancies.filter(t => t.profile_id === (S.me && S.me.id)).map(t => t.unit_id);

/* ====================================================================
   CONNECT
   ==================================================================== */
function configProblem() {
  if (!window.supabase || !window.supabase.createClient)
    return 'The Supabase library did not load. Check your internet connection and refresh the page.';
  if (isPlaceholder(CFG.SUPABASE_URL) || isPlaceholder(CFG.SUPABASE_ANON_KEY)) return 'NEEDS_SETUP';
  if (!/^https:\/\/[^\s/]+\.[^\s/]+$/.test(String(CFG.SUPABASE_URL).replace(/\/$/,'')))
    return 'The Project URL saved here does not look right. It should look like https://abcdefgh.supabase.co';
  return null;
}

function shell(title, kids) {
  const root = $('#root'); root.innerHTML = '';
  root.appendChild(el('div',{class:'authpage'},[
    el('div',{class:'authbar'},[
      el('div',{class:'co'},[LOGO(), CO]),
      el('div',{class:'tag', text:title})
    ]),
    el('div',{class:'authwrap'},[ el('div',{class:'authcard'},[ el('div',{class:'pad'}, kids) ]) ])
  ]));
}

function showSetupError(msg) {
  /* A resident must never be shown a technical message or a settings form.
     Only someone who set this browser up, or who asked for it in the address
     bar, sees the detail. */
  let mine = false;
  try { mine = !!savedConfig().SUPABASE_URL; } catch (e) {}
  if (!mine && !/(^|[?&])setup=1(&|$)/.test(location.search)) { renderNotPublished(msg); return; }
  shell('Setup', [
    el('h2',{style:'font-size:17px;margin-bottom:10px', text:'Not connected yet'}),
    el('div',{class:'errbox', text:msg}),
    el('button',{class:'btn big', style:'margin-top:14px', text:'Start setup again',
      onclick:()=>{ try{localStorage.removeItem('gl_setup');}catch(e){} location.reload(); }})
  ]);
}

/* ---------------------------------------------------------------------------
   ONE-TIME SETUP, done in the browser. No text editor needed.
   --------------------------------------------------------------------------- */
/* A visitor who lands on a copy that has not been published with its settings
   must not be handed a technical form. Only the owner goes past this door. */
function renderNotPublished(detail) {
  shell('Not ready yet', [
    el('h2',{style:'font-size:19px;margin-bottom:8px', text:'This page is not ready yet'}),
    el('p',{class:'authnote',
      text:'The resident portal for ' + CO + ' has not finished being set up. '
         + 'Nothing is wrong at your end.'}),
    el('div',{class:'note', style:'margin-top:14px'},[
      el('b',{text:'If you are a resident'}),
      el('div',{style:'margin-top:6px', text:'Please contact the office. A working link will be sent to you.'})
    ]),
    el('div',{class:'authalt'},[
      el('button',{class:'linkbtn', type:'button', text:'I am the owner — connect this site',
        onclick:()=>{ if (detail) toast(detail, true); renderSetup(true); }})
    ])
  ]);
}

function renderSetup(force) {
  const saved = savedConfig();
  const knownOwner = force || saved.SUPABASE_URL
                  || /(^|[?&])setup=1(&|$)/.test(location.search);
  if (!knownOwner) { renderNotPublished(); return; }
  shell('First-time setup', buildSetupForm(saved));
}

function buildSetupForm(saved) {
  const kids = [];
  kids.push(el('h2',{style:'font-size:18px;margin-bottom:6px', text:'Connect your website'}));
  kids.push(el('p',{class:'authnote',
    text:'This is a one-time step. Copy two things out of Supabase and paste them below. Nothing here is technical — it is copy and paste.'}));

  kids.push(el('div',{class:'note', style:'margin-bottom:16px'},[
    'In Supabase, go to ',
    el('b',{text:'Settings → API Keys'}),
    '. You need the ',
    el('b',{text:'Project URL'}),
    ' and the ',
    el('b',{text:'publishable'}),
    ' (or ',
    el('b',{text:'anon'}),
    ') key.'
  ]));

  const f = el('form',{class:'formstack'});
  const url = field({label:'1. Project URL', id:'su_url', ph:'https://abcdefgh.supabase.co',
    value: saved.SUPABASE_URL || ''});
  const key = field({label:'2. Publishable / anon key', id:'su_key', ph:'sb_publishable_…  or  eyJ…',
    value: saved.SUPABASE_ANON_KEY || ''});
  const co  = field({label:'Company name', id:'su_co', value: saved.COMPANY_NAME || 'Green Lodging LLC'});
  const tel = field({label:'Emergency phone (shown to tenants)', id:'su_tel', type:'tel',
    ph:'(718) 555-0134', value: saved.EMERGENCY_PHONE || ''});
  const eml = field({label:'Office email (shown to tenants)', id:'su_eml', type:'email',
    ph:'office@greenlodging.com', value: saved.OFFICE_EMAIL || ''});
  const err = el('div',{class:'errbox hide'});
  const go  = el('button',{class:'btn pri big', type:'submit', text:'Connect'});
  [url, key, co, tel, eml].forEach(x => f.appendChild(x.wrap));
  f.appendChild(err); f.appendChild(go);

  kids.push(f);
  kids.push(el('p',{class:'authnote', style:'margin-top:16px;font-size:12px',
    text:'Never paste the key labelled “secret” or “service_role”. That one ignores every security rule. This page will refuse it.'}));

  f.addEventListener('submit', async e => {
    e.preventDefault();
    err.classList.add('hide');
    const u = url.input.value.trim().replace(/\/+$/,'');
    const k = key.input.value.trim();
    const fail = m => { err.textContent = m; err.classList.remove('hide'); };

    if (!/^https:\/\/[^\s/]+\.[^\s/]+$/.test(u))
      return fail('That Project URL does not look right. It should start with https:// and look like https://abcdefgh.supabase.co');
    if (!k) return fail('Paste your publishable key.');
    if (/secret|service_role/i.test(k))
      return fail('That is the SECRET key — it must never go on a website. Go back to Supabase and copy the one labelled “publishable” or “anon” instead.');
    if (k.length < 20) return fail('That key looks too short. Copy the whole thing.');

    const cfg = {
      SUPABASE_URL: u, SUPABASE_ANON_KEY: k,
      COMPANY_NAME: co.input.value.trim() || 'Green Lodging LLC',
      EMERGENCY_PHONE: tel.input.value.trim(),
      OFFICE_EMAIL: eml.input.value.trim()
    };

    go.disabled = true; go.textContent = 'Checking…';
    let client;
    try { client = window.supabase.createClient(u, k); }
    catch (ex) { go.disabled = false; go.textContent = 'Connect'; return fail('Could not use those values. Check them and try again.'); }
    const probe = await client.from('buildings').select('name').limit(1);
    go.disabled = false; go.textContent = 'Connect';
    if (probe.error) {
      return fail('Connected to Supabase, but it refused: “' + probe.error.message +
        '”. Usually this means the database script has not been run yet, or the key belongs to a different project.');
    }

    try { localStorage.setItem('gl_setup', JSON.stringify(cfg)); } catch (ex) {}
    showSetupDone(cfg, (probe.data || []).length);
  });

  return kids;
}

function showSetupDone(cfg, rows) {
  shell('Setup complete', [
    el('h2',{style:'font-size:18px;margin-bottom:6px', text:'Connected'}),
    el('div',{class:'okbox', text: rows
      ? 'Your database answered and your buildings are there. This computer can now use the site.'
      : 'Your database answered. This computer can now use the site.'}),

    el('p',{class:'authnote', style:'margin-top:16px'},),
    el('div',{class:'note', style:'margin-top:14px'},[
      el('b',{text:'One last thing, and then you are finished for good.'}),
      el('div',{style:'margin-top:6px'},[
        'What you just typed is saved on ', el('b',{text:'this computer only'}),
        '. Download the finished file below and upload it to Netlify once — then it works for your manager and your tenants too, on any device.'
      ])
    ]),

    el('button',{class:'btn pri big', style:'margin-top:16px',
      text:'Download my finished website file', onclick:function(){ downloadConfigured(cfg, this); }}),

    el('div',{style:'margin-top:14px'},[
      el('div',{class:'eyebrow', text:'Then, in Netlify'}),
      el('ol',{style:'margin:8px 0 0;padding-left:20px;font-size:13.5px;line-height:1.7;color:var(--ink-2)'},[
        el('li',{text:'Open your site, click the Deploys tab'}),
        el('li',{text:'Drag the downloaded index.html onto the drop area'}),
        el('li',{text:'Wait 20 seconds, then reload your site'})
      ])
    ]),

    el('button',{class:'btn big', style:'margin-top:18px', text:'Skip for now and open the website',
      onclick:()=>location.reload()})
  ]);
}

async function downloadConfigured(cfg, btn) {
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Preparing…';

  let src = null;
  try {
    const r = await fetch(location.href, {cache:'no-store'});
    if (r.ok) src = await r.text();
  } catch (e) {}
  if (!src || src.indexOf('GL_CONFIG') < 0) {
    src = '<!doctype html>\n' + document.documentElement.outerHTML;
  }

  /* Only the settings block at the very top is rewritten. Everything after it
     is the program itself and must not be touched, so the edit is confined to
     the few hundred characters that follow the word GL_CONFIG. */
  const at = src.indexOf('GL_CONFIG');
  if (at < 0) {
    btn.disabled = false; btn.textContent = original;
    toast('Could not build the file here. Tell Claude and it will send you a finished copy.', true);
    return;
  }
  const END  = Math.min(at + 1600, src.length);
  const head = src.slice(0, at), tail = src.slice(END);
  let block  = src.slice(at, END);

  const q = v => '"' + String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/"/g,'\\"') + '"';
  const set = (key, val) => {
    const re = new RegExp(key + '\\s*:\\s*"[^"]*"');
    if (re.test(block)) block = block.replace(re, key + ': ' + q(val));
  };
  set('SUPABASE_URL',      cfg.SUPABASE_URL);
  set('SUPABASE_ANON_KEY', cfg.SUPABASE_ANON_KEY);
  set('COMPANY_NAME',      cfg.COMPANY_NAME);
  set('EMERGENCY_PHONE',   cfg.EMERGENCY_PHONE);
  set('OFFICE_EMAIL',      cfg.OFFICE_EMAIL);

  if (/PASTE_YOUR_/.test(block)) {
    btn.disabled = false; btn.textContent = original;
    toast('Could not build the file here. Tell Claude and it will send you a finished copy.', true);
    return;
  }
  src = head + block + tail;

  const a = el('a',{href:URL.createObjectURL(new Blob([src],{type:'text/html'})), download:'index.html'});
  document.body.appendChild(a); a.click(); a.remove();
  btn.disabled = false; btn.textContent = 'Downloaded — get it from your Downloads folder';
}

    + '<path d="M8 23V13l8-5 8 5v10" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linejoin="round"/>'
    + '<rect x="13.5" y="17" width="5" height="6" fill="currentColor"/>';
  return s;
};

function field(o) {
  const w = el('div',{class:'fld'+(o.type==='checkbox'?' check':'')});
  const i = el('input',{type:o.type||'text', id:o.id, placeholder:o.ph||'',
    autocomplete:o.ac||null, inputmode:o.im||null, value:o.value||null});
  if (o.type === 'checkbox') { w.appendChild(i); w.appendChild(el('label',{for:o.id, text:o.label})); }
  else { w.appendChild(el('label',{for:o.id, text:o.label})); w.appendChild(i); }
  if (o.help) w.appendChild(el('div',{class:'help', text:o.help}));
  return {wrap:w, input:i};
}

/* ---------------------------------------------------------------------------
   SIGN IN  /  CREATE ACCOUNT
   One screen. Email and password, with the password readable on request.
   If sign-in fails because there is no such account, the error itself offers
   to create one — carrying the email across so nothing is retyped.
   --------------------------------------------------------------------------- */
const EYE_OPEN = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 12s3.8-7 10.2-7 10.2 7 10.2 7-3.8 7-10.2 7S1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>';
const EYE_SHUT = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10.2 7 10.2 7a18.5 18.5 0 0 1-2.7 3.6M6.3 6.4A18.3 18.3 0 0 0 1.8 12s3.8 7 10.2 7c2 0 3.7-.7 5.2-1.6"/><path d="m2 2 20 20"/><path d="M9.8 9.9a3.2 3.2 0 0 0 4.4 4.4"/></svg>';

/* A password box with a reveal button and a Caps Lock warning. */
function pwField(o) {
  const wrap = el('div',{class:'fld'});
  wrap.appendChild(el('label',{for:o.id, text:o.label}));
  const box = el('div',{class:'pwwrap'});
  const inp = el('input',{id:o.id, type:'password', placeholder:o.ph||'',
    autocomplete:o.ac||'current-password', autocapitalize:'off', spellcheck:'false'});
  const eye = el('button',{type:'button', class:'pweye', 'aria-label':'Show password',
    'aria-pressed':'false', title:'Show password'});
  eye.innerHTML = EYE_OPEN;
  eye.addEventListener('click', () => {
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    eye.innerHTML = show ? EYE_SHUT : EYE_OPEN;
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    eye.setAttribute('aria-pressed', show ? 'true' : 'false');
    eye.title = show ? 'Hide password' : 'Show password';
    const p = inp.selectionStart; inp.focus();
    try { inp.setSelectionRange(p, p); } catch (e) {}
  });
  box.appendChild(inp); box.appendChild(eye);
  wrap.appendChild(box);

  const caps = el('div',{class:'capslock hide', text:'Caps Lock is on'});
  wrap.appendChild(caps);
  const checkCaps = e => {
    const on = e.getModifierState && e.getModifierState('CapsLock');
    caps.classList.toggle('hide', !on);
  };
  inp.addEventListener('keyup', checkCaps);
  inp.addEventListener('keydown', checkCaps);
  inp.addEventListener('blur', () => caps.classList.add('hide'));

  if (o.meter) {
    const m = el('div',{class:'meter', style:'margin-top:7px'});
    const bar = el('i'); m.appendChild(bar);
    const lab = el('div',{class:'help', style:'margin-top:5px', text:'Use at least 8 characters.'});
    wrap.appendChild(m); wrap.appendChild(lab);
    inp.addEventListener('input', () => {
      const v = inp.value;
      let s = 0;
      if (v.length >= 8) s++;
      if (v.length >= 12) s++;
      if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
      if (/\d/.test(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;
      if (!v) s = 0;
      const pct = [0, 20, 40, 60, 80, 100][Math.min(s,5)];
      const col = s <= 1 ? 'var(--crit)' : s <= 3 ? 'var(--warn)' : 'var(--brand)';
      bar.style.width = pct + '%'; bar.style.background = col;
      lab.textContent = !v ? 'Use at least 8 characters.'
        : v.length < 8 ? 'Too short — at least 8 characters.'
        : s <= 2 ? 'Weak. Add a capital letter or a number.'
        : s <= 3 ? 'Good.' : 'Strong.';
    });
  }
  return {wrap, input: inp};
}

const LAST_EMAIL_KEY = 'gl_last_email';
const rememberEmail = e => { try { localStorage.setItem(LAST_EMAIL_KEY, e); } catch (x) {} };
const lastEmail = () => { try { return localStorage.getItem(LAST_EMAIL_KEY) || ''; } catch (x) { return ''; } };

/* Two doors, one card: Resident and Property manager. Which door you pick
   changes the wording and the sign-up form — never what you are allowed to
   see. That is decided by your account, in the database. */
let AUDIENCE = 'resident';
try { if (localStorage.getItem('gl_audience') === 'staff') AUDIENCE = 'staff'; } catch (e) {}
const isStaffDoor = () => AUDIENCE === 'staff';

/* mode: 'signin' | 'signup'.  seed: values carried across from the other mode. */
function renderAuth(mode, seed) {
  seed = seed || {};
  if (seed.audience) AUDIENCE = seed.audience;
  const root = $('#root'); root.innerHTML = '';

  const pad  = el('div',{class:'pad'});
  const tabs = el('div',{class:'audtabs', role:'tablist', 'aria-label':'Who is signing in'});
  [['resident','Resident'], ['staff','Property manager']].forEach(([k, label]) => {
    const b = el('button',{type:'button', text:label, role:'tab', id:'aud_'+k});
    b.setAttribute('aria-selected', AUDIENCE === k ? 'true' : 'false');
    b.addEventListener('click', () => {
      if (AUDIENCE === k) return;
      AUDIENCE = k;
      try { localStorage.setItem('gl_audience', k); } catch (e) {}
      renderAuth(mode, seed);
    });
    tabs.appendChild(b);
  });

  root.appendChild(el('div',{class:'authpage solo'},[
    el('div',{class:'authwrap'},[
      el('div',{class:'authcard'},[
        el('div',{class:'authtop'},[
          el('div',{class:'authmark'},[LOGO()]),
          el('h1',{class:'authco', text:CO}),
          el('p',{class:'authsub', text:'Five buildings in Brooklyn, managed in one place.'})
        ]),
        tabs,
        pad
      ]),
      el('p',{class:'authfoot',
        text:'What you can see is decided by your account, not by the tab you pick.'})
    ])
  ]));
  (mode === 'signup' ? paneSignup : paneSignIn)(pad, seed);
}

/* ---------------------------------------------------------------- sign in */
function paneSignIn(pad, seed) {
  pad.appendChild(el('p',{class:'authnote', style:'margin-bottom:18px',
    text: isStaffDoor()
      ? 'For the property manager and the office. Everything across all five buildings.'
      : 'Your apartment: rent, lease, bills and repairs.'}));

  const f  = el('form',{class:'formstack', novalidate:'novalidate'});
  const em = field({label:'Email', id:'in_email', type:'email', ac:'username',
    ph:'you@example.com', value: seed.email || lastEmail()});
  em.input.setAttribute('autocapitalize','off');
  em.input.setAttribute('spellcheck','false');
  const pw = pwField({label:'Password', id:'in_pw', ac:'current-password'});
  const err = el('div',{class:'errbox hide', role:'alert', 'aria-live':'assertive'});
  const btn = el('button',{class:'btn pri big', type:'submit', text:'Sign in'});

  const forgot = el('div',{class:'rowend'},[
    el('button',{class:'linkbtn', type:'button', text:'Forgot your password?', onclick:async()=>{
      const e2 = em.input.value.trim();
      if (!e2) { showErr(err, 'Type your email in the box above first, then tap this again.'); em.input.focus(); return; }
      const { error } = await S.sb.auth.resetPasswordForEmail(e2, { redirectTo: location.origin + location.pathname });
      if (error) showErr(err, 'Could not send the reset email. Try again in a minute.');
      else { err.classList.add('hide'); toast('If that email has an account, a reset link is on its way.'); }
    }})
  ]);

  f.appendChild(em.wrap); f.appendChild(pw.wrap); f.appendChild(forgot);
  f.appendChild(err); f.appendChild(btn);
  pad.appendChild(f);

  if (CFG.ENABLE_SMS_LOGIN) {
    pad.appendChild(el('div',{style:'margin-top:14px;text-align:center'},[
      el('button',{class:'linkbtn', type:'button', text:'Residents: sign in with a text message instead',
        onclick:()=>{ pad.innerHTML=''; paneSms(pad); }})
    ]));
  }

  pad.appendChild(el('div',{class:'authalt'},[
    isStaffDoor() ? 'New to the office? ' : 'First time here? ',
    el('button',{class:'linkbtn', type:'button',
      text: isStaffDoor() ? 'Create your staff account' : 'Set up with your invite code',
      onclick:()=>renderAuth('signup', {email: em.input.value.trim()})})
  ]));

  f.addEventListener('submit', async e => {
    e.preventDefault();
    err.classList.add('hide');
    const email = em.input.value.trim(), pass = pw.input.value;
    if (!email)  { showErr(err, 'Enter your email address.'); em.input.focus(); return; }
    if (!/.+@.+\..+/.test(email)) { showErr(err, 'That does not look like an email address.'); em.input.focus(); return; }
    if (!pass)   { showErr(err, 'Enter your password.'); pw.input.focus(); return; }

    btn.disabled = true; btn.textContent = 'Signing in…';
    const { error } = await S.sb.auth.signInWithPassword({ email: email, password: pass });
    if (!error) { rememberEmail(email); return; }          // page reloads on success
    btn.disabled = false; btn.textContent = 'Sign in';

    const m = String(error.message || '').toLowerCase();
    if (m.indexOf('invalid login') >= 0) {
      /* Supabase deliberately will not say whether the email exists, so offer
         both roads instead of guessing. */
      err.innerHTML = '';
      err.appendChild(el('b',{text:'That email and password did not match.'}));
      err.appendChild(el('div',{text:'Check for a typo — tap the eye to read your password. If you have never set up an account here, create one.'}));
      err.appendChild(el('div',{style:'margin-top:9px;display:flex;gap:8px;flex-wrap:wrap'},[
        el('button',{class:'btn sm pri', type:'button', text:'Create an account with this email',
          onclick:()=>renderAuth('signup', {email: email})})
      ]));
      err.classList.remove('hide');
      pw.input.select();
    } else {
      showErr(err, friendlyAuthError(error));
    }
  });

  setTimeout(() => { (em.input.value ? pw.input : em.input).focus(); }, 60);
}

function showErr(box, msg) { box.innerHTML = ''; box.textContent = msg; box.classList.remove('hide'); }

/* --------------------------------------------------------- create account */
function paneSignup(pad, seed) {
  const staffDoor = isStaffDoor();
  pad.appendChild(el('p',{class:'authnote', style:'margin-bottom:18px',
    text: staffDoor
      ? 'Create your account, then the owner switches on your access. Until then you will see an empty portal.'
      : 'Use the invite code from the slip you were given. It works once, for your apartment.'}));

  const f = el('form',{class:'formstack', novalidate:'novalidate'});
  const nm = field({label:'Full name', id:'up_name', ac:'name', ph:'As it appears on the lease',
    value: seed.name || ''});
  const em = field({label:'Email', id:'up_email', type:'email', ac:'username',
    ph:'you@example.com', value: seed.email || ''});
  em.input.setAttribute('autocapitalize','off');
  em.input.setAttribute('spellcheck','false');
  const pw = pwField({label:'Choose a password', id:'up_pw', ac:'new-password', meter:true});
  const ph = field({label:'Mobile number (optional)', id:'up_phone', type:'tel', im:'tel', ph:'(718) 555-0134'});
  const cd = field({label:'Invite code', id:'up_code', ph:'RALPH-2R-4K9',
    help:'From the slip your landlord gave you.'});
  cd.input.setAttribute('autocapitalize','characters');
  const err = el('div',{class:'errbox hide', role:'alert', 'aria-live':'assertive'});
  const btn = el('button',{class:'btn pri big', type:'submit', text:'Create my account'});

  const fields = staffDoor ? [nm, em, pw, ph] : [nm, em, pw, ph, cd];
  fields.forEach(x => f.appendChild(x.wrap));
  f.appendChild(err); f.appendChild(btn);
  pad.appendChild(f);

  pad.appendChild(el('div',{class:'authalt'},[
    'Already have an account? ',
    el('button',{class:'linkbtn', type:'button', text:'Sign in',
      onclick:()=>renderAuth('signin', {email: em.input.value.trim()})})
  ]));

  f.addEventListener('submit', async e => {
    e.preventDefault();
    err.classList.add('hide');
    const name = nm.input.value.trim(), email = em.input.value.trim(), pass = pw.input.value;
    if (!name)  { showErr(err, 'Enter your full name.'); nm.input.focus(); return; }
    if (!/.+@.+\..+/.test(email)) { showErr(err, 'Enter a valid email address.'); em.input.focus(); return; }
    if (pass.length < 8) { showErr(err, 'Your password needs at least 8 characters. Tap the eye to check what you typed.'); pw.input.focus(); return; }

    btn.disabled = true; btn.textContent = 'Creating…';
    const { data, error } = await S.sb.auth.signUp({
      email: email, password: pass, options:{ data:{ full_name: name } }
    });

    if (error) {
      btn.disabled = false; btn.textContent = 'Create my account';
      const m = String(error.message || '').toLowerCase();
      if (m.indexOf('already') >= 0 || m.indexOf('registered') >= 0) {
        err.innerHTML = '';
        err.appendChild(el('b',{text:'There is already an account with that email.'}));
        err.appendChild(el('div',{text:'Sign in instead, or use “Forgot your password?” if you cannot remember it.'}));
        err.appendChild(el('div',{style:'margin-top:9px'},[
          el('button',{class:'btn sm pri', type:'button', text:'Go to sign in',
            onclick:()=>renderAuth('signin', {email: email})})
        ]));
        err.classList.remove('hide');
      } else showErr(err, friendlyAuthError(error));
      return;
    }

    rememberEmail(email);

    if (!data.session) {
      const s2 = await S.sb.auth.signInWithPassword({ email: email, password: pass });
      if (s2.error) {
        pad.innerHTML = '';
        pad.appendChild(el('h2',{style:'font-size:18px;margin-bottom:8px', text:'Almost there'}));
        pad.appendChild(el('div',{class:'okbox',
          text: staffDoor
            ? 'Your account was created. Check your email for a confirmation link, then come back and sign in. The owner switches on your office access after that.'
            : 'Your account was created. Check your email for a confirmation link, then come back and sign in — you can enter your invite code at that point.'}));
        pad.appendChild(el('button',{class:'btn big', style:'margin-top:14px', text:'Back to sign in',
          onclick:()=>renderAuth('signin', {email: email})}));
        return;
      }
    }

    const code = staffDoor ? '' : cd.input.value.trim();
    if (code) {
      const r = await S.sb.rpc('redeem_invite', {
        p_code: code, p_full_name: name, p_phone: ph.input.value.trim()
      });
      if (r.error || (r.data && r.data.ok === false)) {
        /* The account exists and they are signed in; only the code failed, so
           hand them straight to the screen that asks for it again. */
        toast((r.data && r.data.error) || 'That invite code did not work.', true);
      }
    }
    location.reload();
  });

  setTimeout(() => { (seed.email ? nm.input : nm.input).focus(); }, 60);
}

/* ----------------------------------- residents, by text message (optional) */
function paneSms(pad) {
  pad.appendChild(el('h2',{style:'font-size:20px;margin-bottom:5px', text:'Sign in by text'}));
  pad.appendChild(el('p',{class:'authnote', text:'Enter your mobile number and we will text you a 6-digit code.'}));
  const f = el('form',{class:'formstack', novalidate:'novalidate'});
  const ph = field({label:'Mobile number', id:'sm_phone', type:'tel', im:'tel', ph:'(718) 555-0134', ac:'tel'});
  const err = el('div',{class:'errbox hide', role:'alert'});
  const btn = el('button',{class:'btn pri big', type:'submit', text:'Text me a code'});
  f.appendChild(ph.wrap); f.appendChild(err); f.appendChild(btn);
  pad.appendChild(f);
  pad.appendChild(el('div',{class:'authalt'},[
    el('button',{class:'linkbtn', type:'button', text:'Use email and password instead',
      onclick:()=>renderAuth('signin', {})})
  ]));

  f.addEventListener('submit', async e => {
    e.preventDefault(); err.classList.add('hide');
    const digits = ph.input.value.replace(/\D/g,'');
    if (digits.length < 10) { showErr(err, 'Enter your full 10-digit mobile number.'); return; }
    const phone = digits.length === 10 ? (CFG.PHONE_COUNTRY_CODE||'+1') + digits : '+' + digits;
    btn.disabled = true; btn.textContent = 'Sending…';
    const { error } = await S.sb.auth.signInWithOtp({ phone: phone });
    if (error) { showErr(err, friendlyAuthError(error)); btn.disabled = false; btn.textContent = 'Text me a code'; return; }

    pad.innerHTML = '';
    pad.appendChild(el('h2',{style:'font-size:20px;margin-bottom:5px', text:'Check your phone'}));
    pad.appendChild(el('p',{class:'authnote', text:'We texted a 6-digit code to ' + ph.input.value + '. It expires in a few minutes.'}));
    const f2 = el('form',{class:'formstack', novalidate:'novalidate'});
    const cd = field({label:'6-digit code', id:'sm_code', im:'numeric', ph:'123456', ac:'one-time-code'});
    const e2 = el('div',{class:'errbox hide', role:'alert'});
    const b2 = el('button',{class:'btn pri big', type:'submit', text:'Sign in'});
    f2.appendChild(cd.wrap); f2.appendChild(e2); f2.appendChild(b2);
    pad.appendChild(f2);
    pad.appendChild(el('div',{class:'authalt'},[
      el('button',{class:'linkbtn', type:'button', text:'Use a different number',
        onclick:()=>{ pad.innerHTML=''; paneSms(pad); }})
    ]));
    cd.input.focus();
    f2.addEventListener('submit', async ev => {
      ev.preventDefault(); e2.classList.add('hide');
      b2.disabled = true; b2.textContent = 'Checking…';
      const r = await S.sb.auth.verifyOtp({ phone: phone, token: cd.input.value.trim(), type:'sms' });
      if (r.error) { showErr(e2, 'That code did not work. Check it and try again.'); b2.disabled = false; b2.textContent = 'Sign in'; }
    });
  });
}

function friendlyAuthError(e) {
  const m = String(e && e.message || '').toLowerCase();
  if (m.includes('invalid login')) return 'That email and password do not match. Check for typos, or use "Forgot your password?".';
  if (m.includes('email not confirmed')) return 'Your email is not confirmed yet. Check your inbox for the confirmation link.';
  if (m.includes('already registered') || m.includes('already been registered')) return 'There is already an account with that email. Sign in instead.';
  if (m.includes('rate') || m.includes('too many')) return 'Too many attempts. Wait a minute and try again.';
  if (m.includes('sms') || m.includes('phone')) return 'Text-message sign-in is not switched on yet. Use email and password.';
  if (m.includes('password')) return 'That password is too short or too weak. Use at least 8 characters.';
  return (e && e.message) || 'Something went wrong. Try again.';
}

async function loadAll() {
  const q = (t, sel) => S.sb.from(t).select(sel || '*');
  const jobs = [
    ['buildings',    q('buildings')],
    ['units',        q('units')],
    ['tenancies',    q('tenancies')],
    ['leases',       q('leases')],
    ['rent',         q('rent_payments')],
    ['complaints',   q('complaints')],
    ['cupdates',     q('complaint_updates')],
    ['documents',    q('documents')],
    ['utilBills',    q('utility_bills')],
    ['charges',      q('other_charges')]
  ];
  if (isStaff()) {
    jobs.push(['utilAccounts', q('utility_accounts')]);
    jobs.push(['profiles',     q('profiles')]);
    jobs.push(['invites',      q('unit_invites')]);
    jobs.push(['expenses',     q('building_expenses')]);
  }
  const res = await Promise.all(jobs.map(j => j[1]));
  res.forEach((r, i) => {
    const key = jobs[i][0];
    if (r.error) { console.warn('load', key, r.error.message); S[key] = []; }
    else S[key] = r.data || [];
  });
  S.loading = false;
}

/* ====================================================================
   FILES
   ==================================================================== */
async function uploadTo(path, file) {
  const { error } = await S.sb.storage.from('docs').upload(path, file, { upsert:false, contentType:file.type || undefined });
  if (error) throw error;
  return path;
}
function staffPath(buildingId, unitId, tenantVisible, filename) {
  const stamp = uid4().slice(0,8) + '-' + cleanName(filename);
  return (tenantVisible && unitId) ? ('t/' + unitId + '/' + stamp) : ('s/' + (buildingId || 'misc') + '/' + stamp);
}
function tenantInboxPath(unitId, filename) {
  return 't/' + unitId + '/inbox/' + uid4().slice(0,8) + '-' + cleanName(filename);
}
async function openFile(path) {
  if (!path) return;
  const { data, error } = await S.sb.storage.from('docs').createSignedUrl(path, 3600);
  if (error || !data) { toast('Could not open that file.', true); return; }
  window.open(data.signedUrl, '_blank', 'noopener');
}
function fileBtn(path, label) {
  if (!path) return el('span',{class:'sub', text:'—'});
  return el('button',{class:'doclink', type:'button', text:label||'View', onclick:()=>openFile(path)});
}

/* Records a document row; uploads first. Returns the row or null. */
async function fileDocument(file, meta) {
  if (!file) return null;
  if (file.size > 20*1024*1024) { toast('That file is larger than 20 MB. Try a photo instead of a scan.', true); return null; }
  const path = meta.asTenant ? tenantInboxPath(meta.unit_id, file.name)
                             : staffPath(meta.building_id, meta.unit_id, meta.tenant_visible, file.name);
  try { await uploadTo(path, file); }
  catch (e) { toast('Upload failed: ' + (e.message || 'unknown error'), true); return null; }
  const row = {
    building_id: meta.building_id || null, unit_id: meta.unit_id || null,
    category: meta.category || 'Other', name: file.name, storage_path: path,
    size_bytes: file.size, content_type: file.type || null,
    tenant_visible: meta.asTenant ? true : !!meta.tenant_visible,
    note: meta.note || null, uploaded_by: S.me.id
  };
  const { data, error } = await S.sb.from('documents').insert(row).select().single();
  if (error) { toast('File uploaded but not filed: ' + error.message, true); return { storage_path: path }; }
  S.documents.push(data);
  return data;
}

/* ====================================================================
   SAVE HELPERS
   ==================================================================== */
async function put(table, stateKey, row, id) {
  let res;
  if (id) res = await S.sb.from(table).update(row).eq('id', id).select().single();
  else    res = await S.sb.from(table).insert(row).select().single();
  if (res.error) { toast(friendlyDbError(res.error), true); return null; }
  const arr = S[stateKey];
  const i = arr.findIndex(x => x.id === res.data.id);
  if (i >= 0) arr[i] = res.data; else arr.push(res.data);
  return res.data;
}
async function del(table, stateKey, id, keyCol) {
  const col = keyCol || 'id';
  const { error } = await S.sb.from(table).delete().eq(col, id);
  if (error) { toast(friendlyDbError(error), true); return false; }
  S[stateKey] = S[stateKey].filter(x => x[col] !== id);
  return true;
}
function friendlyDbError(e) {
  const m = String(e && e.message || '');
  if (/row-level security|violates row-level/i.test(m)) return 'Your account is not allowed to do that.';
  if (/duplicate key/i.test(m) && /unit_invites/i.test(m)) return 'That invite code already exists. Pick another.';
  if (/duplicate key/i.test(m) && /units/i.test(m)) return 'That unit number already exists in this building.';
  if (/duplicate key/i.test(m) && /rent_payments/i.test(m)) return 'There is already a rent record for that unit and month.';
  if (/duplicate key/i.test(m)) return 'That record already exists.';
  if (/foreign key/i.test(m)) return 'Something it points at was deleted. Refresh the page.';
  return m || 'Could not save.';
}

function closeModal(){ $('#modalRoot').innerHTML=''; document.body.style.overflow=''; }

function openForm(o) {
  const root = $('#modalRoot'); root.innerHTML=''; document.body.style.overflow='hidden';
  const body = el('div',{class:'mb'});
  if (o.note) body.appendChild(el('div',{class:'note', text:o.note}));
  const errBox = el('div',{class:'errbox hide'});
  const inputs = {};

  const make = f => {
    const id = 'gf_' + f.k;
    const v  = (o.values || {})[f.k];
    const w  = el('div',{class:'fld' + (f.t==='checkbox'?' check':'')});
    let inp;
    if (f.t === 'select') {
      inp = el('select',{id});
      if (f.ph) inp.appendChild(el('option',{value:'', text:f.ph}));
      (f.opts||[]).forEach(x => {
        const val = (typeof x==='string') ? x : x.v, lab = (typeof x==='string') ? x : x.l;
        inp.appendChild(el('option',{value:val, text:lab}));
      });
      inp.value = (v==null ? '' : String(v));
      if (inp.selectedIndex < 0) inp.selectedIndex = 0;
    } else if (f.t === 'textarea') {
      inp = el('textarea',{id, placeholder:f.ph||''}); inp.value = v || '';
    } else if (f.t === 'file') {
      inp = el('input',{id, type:'file', accept:f.accept || 'image/*,application/pdf'});
    } else if (f.t === 'checkbox') {
      inp = el('input',{id, type:'checkbox'}); inp.checked = !!v;
    } else {
      inp = el('input',{id, type:f.t||'text', placeholder:f.ph||'',
        step: f.t==='number' ? '0.01' : null, inputmode: f.t==='number' ? 'decimal' : null});
      inp.value = (v==null ? '' : v);
    }
    if (f.t === 'checkbox') { w.appendChild(inp); w.appendChild(el('label',{for:id, text:f.l})); }
    else { w.appendChild(el('label',{for:id, text:f.l})); w.appendChild(inp); }
    if (f.help) w.appendChild(el('div',{class:'help', text:f.help}));
    inputs[f.k] = { inp, f };
    return w;
  };

  for (let i=0; i<o.fields.length; i++) {
    const f = o.fields[i];
    if (f.t === 'hr') { body.appendChild(el('div',{class:'eyebrow', text:f.l, style:'margin-top:4px'})); continue; }
    const n = o.fields[i+1];
    if (f.half && n && n.half) { const r = el('div',{class:'row2'}); r.appendChild(make(f)); r.appendChild(make(n)); body.appendChild(r); i++; }
    else body.appendChild(make(f));
  }
  body.appendChild(errBox);

  const foot = el('div',{class:'mf'});
  if (o.danger && isOwner()) foot.appendChild(el('button',{class:'btn danger', text:o.danger.label, style:'margin-right:auto',
    onclick: async () => { if (!confirm('Delete this permanently? This cannot be undone.')) return; closeModal(); await o.danger.fn(); render(); }}));
  foot.appendChild(el('button',{class:'btn', text:'Cancel', onclick:closeModal}));
  const go = el('button',{class:'btn pri', text:o.submit || 'Save'});
  foot.appendChild(go);

  const modal = el('div',{class:'modal'},[ el('div',{class:'mh'},[el('h3',{text:o.title})]), body, foot ]);
  const scrim = el('div',{class:'scrim', onclick:e=>{ if(e.target===scrim) closeModal(); }},[modal]);
  root.appendChild(scrim);
  const esc = e => { if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', esc); } };
  document.addEventListener('keydown', esc);
  const first = body.querySelector('input,select,textarea'); if (first) first.focus();

  go.addEventListener('click', async () => {
    const vals = {}, files = {};
    let missing = null;
    for (const k in inputs) {
      const { inp, f } = inputs[k];
      if (f.t === 'file') { files[k] = (inp.files && inp.files[0]) || null; continue; }
      let v = (f.t === 'checkbox') ? inp.checked : inp.value;
      if (f.req && (v === '' || v == null)) missing = missing || f.l;
      if (f.t === 'number') v = (v === '' ? null : Number(v));
      if (typeof v === 'string') v = v.trim();
      if (v === '') v = null;
      vals[k] = v;
    }
    if (missing) { errBox.textContent = '“' + missing + '” is required.'; errBox.classList.remove('hide'); return; }
    errBox.classList.add('hide');
    go.disabled = true; go.textContent = 'Saving…';
    try { await o.onSubmit(vals, files); closeModal(); render(); }
    catch (err) {
      go.disabled = false; go.textContent = o.submit || 'Save';
      errBox.textContent = (err && err.message) || 'Could not save.'; errBox.classList.remove('hide');
    }
  });
}

/* ====================================================================
   ALERT ENGINE   (staff view)
   ==================================================================== */
function buildAlerts() {
  const A = [];
  const push = (sev,type,t,d,when,go) => A.push({sev,type,t,d,when,go});

  S.leases.forEach(l => {
    if (!l.end_date) return;
    const n = days(l.end_date);
    if (!byId('units', l.unit_id)) return;
    const who = l.tenant_name || 'vacant';
    if (n < 0)
      push('crit','Lease', uFull(l.unit_id)+' — lease expired',
        who+' · expired '+fmtDate(l.end_date)+', '+Math.abs(n)+' days ago. The tenancy continues month-to-month until renewed.', Math.abs(n)+'d ago','buildings');
    else if (n <= RENEW_CLOSE)
      push('crit','Renewal', uFull(l.unit_id)+' — renewal offer is late',
        'Lease ends '+fmtDate(l.end_date)+'. The 90–150 day window to serve the renewal offer has closed. Serve DHCR form RTP-8 immediately.', 'in '+n+'d','buildings');
    else if (n <= RENEW_OPEN)
      push('warn','Renewal', uFull(l.unit_id)+' — serve the renewal lease now',
        who+' · lease ends '+fmtDate(l.end_date)+'. You are inside the 90–150 day window to offer a renewal (DHCR form RTP-8).', 'in '+n+'d','buildings');
    else if (n <= 210)
      push('info','Lease', uFull(l.unit_id)+' — renewal window opens soon',
        'Lease ends '+fmtDate(l.end_date)+'. You may serve the renewal offer from '+fmtDate(isoOf(new Date(new Date(l.end_date+'T00:00:00') - RENEW_OPEN*864e5)))+'.', 'in '+n+'d','buildings');

    const u = byId('units', l.unit_id);
    if (u && u.is_stabilized && l.rider_signed === false && n > 0)
      push('warn','Rider', uFull(l.unit_id)+' — rent stabilization rider not signed',
        'A signed DHCR rider must be attached to every stabilized lease.', '', 'buildings');
  });

  /* Rent arrears, split by who owes it — you chase a tenant and an agency in
     completely different ways, and only one of them can be taken to court. */
  [addMonths(CUR_PERIOD,-1), CUR_PERIOD].forEach(period => {
    S.units.forEach(u => {
      const s = split(u.id, period);
      if (!s || !s.total) return;
      const n = days(s.dueDate);
      const who = s.tenantName || 'the tenant';

      /* Never chase a unit no payment was ever recorded for — that is a gap in
         the records, not evidence that anyone is behind. */
      const hasHistory = S.rent.some(r => r.unit_id === u.id);
      if (!hasHistory) return;

      if (s.tenantShort > 0.5) {
        if (n < 0)
          push('crit','Tenant rent', uFull(u.id)+' — '+(s.subsidised?'tenant share':'rent')+' unpaid, '+fmtPeriod(period),
            who+' owes '+money(s.tenantShort)+
            (s.subsidised ? ' of their '+money(s.tenantDue)+' share ('+s.program+' covers '+money(s.govtDue)+')' : '')+
            ' · '+Math.abs(n)+' days past the '+fmtShort(s.dueDate)+' due date.', money0(s.tenantShort),'rent');
        else if (n <= 7)
          push('warn','Tenant rent', uFull(u.id)+' — '+(s.subsidised?'tenant share':'rent')+' due '+fmtShort(s.dueDate),
            who+' · '+money(s.tenantShort)+' due in '+n+' day'+(n===1?'':'s')+'.', money0(s.tenantShort),'rent');
      }

      if (s.govtShort > 0.5) {
        if (n < -2)
          push('crit','Agency', uFull(u.id)+' — '+s.program+' has not paid, '+fmtPeriod(period),
            money(s.govtShort)+' expected from '+s.program+
            (s.caseNo ? ' (case '+s.caseNo+')' : '')+
            ' · '+Math.abs(n)+' days late. Chase the agency, not the tenant — this is not the tenant’s debt.',
            money0(s.govtShort),'rent');
        else if (n <= 7)
          push('info','Agency', uFull(u.id)+' — '+s.program+' payment expected',
            money(s.govtShort)+' due around '+fmtShort(s.dueDate)+'.', money0(s.govtShort),'rent');
      }
    });
  });

  S.utilBills.forEach(b => {
    if (b.paid_date || !b.due_date) return;
    const n = days(b.due_date);
    const where = b.unit_id ? uFull(b.unit_id) : bName(b.building_id);
    const lab = String(b.utility_type||'utility').replace(/^./,c=>c.toUpperCase());
    if (n < 0)
      push('crit','Utility', where+' — '+lab+' bill overdue',
        (b.provider?b.provider+' · ':'')+money(b.amount)+' was due '+fmtDate(b.due_date)+' ('+Math.abs(n)+' days ago). Late fees and liens accrue.', money0(b.amount),'utilities');
    else if (n <= 14)
      push('warn','Utility', where+' — '+lab+' bill due '+fmtShort(b.due_date),
        (b.provider?b.provider+' · ':'')+money(b.amount)+' due in '+n+' day'+(n===1?'':'s')+'.', money0(b.amount),'utilities');
  });

  S.utilAccounts.forEach(a => {
    if (!a.due_day) return;
    const cycle = Number(a.cycle_months||1);
    for (let k=0;k<=1;k++) {
      const period = addMonths(CUR_PERIOD,k);
      if (cycle > 1 && (((+period.split('-')[1]) - 1) % cycle !== 0)) continue;
      const dueDate = periodDue(period, a.due_day);
      const n = days(dueDate);
      if (n < 0 || n > 10) continue;
      if (S.utilBills.some(b => b.account_id === a.id && b.due_date && b.due_date.slice(0,7) === period)) continue;
      push('info','Expected', bName(a.building_id)+' — '+a.utility_type+' bill expected by '+fmtShort(dueDate),
        (a.provider||'Account')+(a.account_number?' #'+a.account_number:'')+' bills around the '+ord(a.due_day)+'. Nothing entered for '+fmtPeriod(period)+' yet.', 'in '+n+'d','utilities');
    }
  });

  S.complaints.forEach(c => {
    if (c.status === 'resolved') return;
    const n = Math.abs(days(c.opened_date));
    const official = ['hpd','dob','311'].indexOf(c.source) >= 0;
    const where = c.unit_id ? uFull(c.unit_id) : bName(c.building_id);
    if (official)
      push(n>14?'crit':'warn','Violation', where+' — '+String(c.source).toUpperCase()+' complaint open '+n+' days',
        (c.title||'Complaint')+'. Official complaints become violations if not certified as corrected.', n+'d','complaints');
    else if (n >= 14)
      push(n>30?'crit':'warn','Complaint', where+' — tenant complaint open '+n+' days',
        (c.title||'Complaint')+'. No resolution recorded.', n+'d','complaints');
    else if (n >= 3)
      push('info','Complaint', where+' — '+(c.title||'complaint'),
        'Opened '+fmtDate(c.opened_date)+'. Add an update so the record shows progress.', n+'d','complaints');
  });

  const yr = TODAY.getFullYear(), regDue = yr+'-07-31', nReg = days(regDue);
  if (S.buildings.length && nReg >= -60 && nReg <= 75)
    push(nReg<0?'crit':'warn','DHCR','Annual rent registration — due '+fmtDate(regDue),
      nReg<0 ? 'The '+yr+' Annual Rent Registration (RR-2) deadline has passed. Unregistered units cannot take rent increases.'
             : 'File the '+yr+' Annual Rent Registration for every stabilized unit with DHCR by July 31.',
      nReg<0 ? Math.abs(nReg)+'d ago' : 'in '+nReg+'d', 'buildings');

  const rank = {crit:0, warn:1, info:2};
  return A.sort((a,b) => rank[a.sev]-rank[b.sev]);
}

    (expected && collected>=expected) ? 'brand' : (expected ? 'warn' : '')));

  const steps = [
    {d:S.units.length>0,        t:'Add your apartments and stores',   s:'Buildings → pick a building → Add unit.',                        g:'buildings'},
    {d:S.leases.length>0,       t:'Enter one lease per occupied unit', s:'Tenant name, rent, start and end date. This drives every reminder.', g:'buildings'},
    {d:S.utilAccounts.length>0, t:'Add your utility accounts',        s:'Con Edison, National Grid, NYC DEP — with the day each bills.',  g:'utilities'},
    {d:S.rent.length>0,         t:'Record your first rent payment',   s:'Rent → find the unit → Record. Attach the check photo.',         g:'rent'},
    {d:S.invites.length>0,      t:'Invite your first tenant',         s:'People → Create invite code, then hand the slip to the tenant.',  g:'people'}
  ];

    const p = el('div',{class:'panel'});
    p.appendChild(el('div',{class:'panel-h'},[el('h2',{text:'Getting set up'}), el('div',{class:'spacer'}),

    steps.forEach(s => {
      const row = el('div',{class:'chk'+(s.d?' done':'')});
      row.appendChild(el('div',{class:'mk', text:s.d?'✓':''}));
      row.appendChild(el('div',{class:'tx'},[ el('b',{text:s.t}), el('span',{text:s.s}) ]));
      if (!s.d) row.appendChild(el('button',{class:'btn sm', text:'Go', onclick:()=>go(s.g)}));
      p.appendChild(row);
    });

  }

  const p2 = el('div',{class:'panel'});
  p2.appendChild(el('div',{class:'panel-h'},[el('h2',{text:'What needs you'}), el('div',{class:'spacer'}),
    el('span',{class:'eyebrow', text: alerts.length+' item'+(alerts.length===1?'':'s')})]));

      b.appendChild(el('div',{style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap'},[

      row.appendChild(el('button',{class:'btn sm', text:'Open', onclick:()=>go(a.go)}));
      list.appendChild(row);
    });
    p2.appendChild(list);
  }
  stack.appendChild(p2);
  v.appendChild(stack);
}
